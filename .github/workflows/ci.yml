name: CI

on:
  push:
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `pnpm check` = word-list check + hardcoded-Chinese scan + tsc --noEmit.
      # Anyone who has run these three separately once wants a single command from the start.
      - run: pnpm check
      - run: node --test scripts/dmg-contract.test.mjs
      - run: pnpm test:frontend
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cache key excludes OS: GitHub Actions caches are not isolated per OS, so we must distinguish them ourselves
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ runner.os }}

      # Tauri needs WebKitGTK headers even for `cargo test`. Windows needs nothing extra:
      # native-tls uses SChannel, and WebView2 ships with the runner image.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf

      # tauri-build hard-errors on Windows targets when .ico is missing.
      # Catch it on the PR that touches Windows packaging, not at tag time.
      - name: Windows bundle prerequisites
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/icons/icon.ico || {
            echo "::error::src-tauri/icons/icon.ico is missing; Windows packaging requires it"
            exit 1
          }

      - run: cargo test --manifest-path src-tauri/Cargo.toml
